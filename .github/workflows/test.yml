name: Test

on:
  pull_request:

jobs:
  build:
    name: Test ${{ matrix.release }}-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release:
          - 23.05.5
          - 24.10.4
        target:
          - 'armsr/armv8'
          - 'ipq806x/generic'
          - 'ath79/nand'
          - 'x86/64'

    steps:
      - uses: actions/checkout@v6

      - name: Generate full target name
        env:
          TARGET: ${{ format('{0}-{1}', matrix.target[0], matrix.target[1]) }}
        run: |
          echo "Full target name is $TARGET"
          echo "TARGET=$TARGET" >> $GITHUB_ENV

      - name: Add test directories
        run: mkdir artifacts repo

      - name: Build
        uses: ./
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ matrix.release }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          FEED_DIR: ${{ github.workspace }}/feed
          PACKAGES: vim privoxy

      - name: Verify images saved
        run: find artifacts/bin/targets/${{ matrix.target }}/ -maxdepth 1 -type f | grep .
